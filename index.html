<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak Up 英文表达打卡</title>
<meta name="description" content="每天 30 分钟商务英语口语：场景对话 + 英式演讲跟读，语音识别打分。">
<meta name="theme-color" content="#2F6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak Up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+SC:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one phone column. Home = streak hero, today's 30-min bar, this week's theme with two practice modes, 8-week roadmap. Practice views replace home with a back bar. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --ink:#1E2421; --muted:#68716B; --line:#DCE0DA;
  --moss:#2F6B4F; --moss-soft:#DCEBE2; --navy:#2B4A7A; --navy-soft:#E1E8F3;
  --amber:#A86A12; --amber-soft:#F6EAD3; --slip:#B5483B; --slip-soft:#F6E1DD; --onaccent:#FFFFFF;
  --f-num:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-say:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201D; --ink:#E9EEEA; --muted:#97A29B; --line:#2C3430;
  --moss:#6CC197; --moss-soft:#1F3329; --navy:#8FB0E6; --navy-soft:#1E2838;
  --amber:#E2B05E; --amber-soft:#33281A; --slip:#E7887B; --slip-soft:#3A2220; --onaccent:#0E1411; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201D; --ink:#E9EEEA; --muted:#97A29B; --line:#2C3430;
  --moss:#6CC197; --moss-soft:#1F3329; --navy:#8FB0E6; --navy-soft:#1E2838;
  --amber:#E2B05E; --amber-soft:#33281A; --slip:#E7887B; --slip-soft:#3A2220; --onaccent:#0E1411; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:15px;font-weight:700;letter-spacing:.04em}
.top .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{display:flex;align-items:flex-end;gap:14px}
.big{font-family:var(--f-num);font-weight:800;font-size:96px;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--moss)}
.hero .lbl{padding-bottom:6px;min-width:0}
.hero .lbl b{display:block;font-size:18px}
.hero .lbl span{color:var(--muted);font-size:13px}
.sec h2{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.today .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.today .row1 b{font-family:var(--f-num);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.today .row1 span{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .5s}
.bar.thin{height:6px}
.bar.navy i{background:var(--navy)}
.check{appearance:none;border:0;width:100%;border-radius:16px;padding:14px;font:inherit;font-size:17px;font-weight:900;letter-spacing:.04em;background:var(--moss);color:var(--onaccent);cursor:pointer}
.check.done{background:var(--moss-soft);color:var(--moss)}
.check:disabled{cursor:default}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn{appearance:none;font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--moss);border-color:var(--moss);color:var(--onaccent);font-weight:700}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--onaccent);font-weight:700}
.btn.ghost-navy{color:var(--navy);border-color:var(--navy)}
.btn.warn{color:var(--slip);border-color:var(--slip)}
.btn.solid-warn{background:var(--slip);color:var(--onaccent);border-color:var(--slip)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted)}
.dot.ok{background:var(--moss);border:2px solid var(--moss);color:var(--onaccent)}
.dot.part{border:2px solid var(--moss);color:var(--moss)}
.dot.today{border-style:solid;border-color:var(--ink);color:var(--ink)}
.dot.ok.today{border-color:var(--moss);color:var(--onaccent)}

.theme-head{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--navy)}
.theme-head h3{font-family:var(--f-num);font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.theme-head .cn{color:var(--muted);font-size:14px}
.plan{background:var(--navy-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.plan b{color:var(--navy)}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.prog em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{appearance:none;font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--moss-soft)}
.mode.m2 .ic{background:var(--navy-soft)}
.mode .ic svg{width:20px;height:20px;stroke:var(--moss);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mode.m2 .ic svg{stroke:var(--navy)}
.mode b{font-size:16px}
.mode span{font-size:12px;color:var(--muted);line-height:1.45}
.vocab-btn{justify-content:center}
.road{display:flex;flex-direction:column;gap:8px}
.wk{appearance:none;font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:center;cursor:pointer}
.wk .n{grid-row:span 2;font-family:var(--f-num);font-weight:800;font-size:22px;color:var(--muted);text-align:center}
.wk .t{font-weight:700;font-size:14px;min-width:0}
.wk .t small{font-weight:400;color:var(--muted);margin-left:6px}
.wk.cur{border-color:var(--navy);background:var(--navy-soft)}
.wk.cur .n{color:var(--navy)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.tip svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:100%}

/* practice views */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:10px;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.timer{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px;color:var(--moss);font-weight:600}
.scene-card{background:var(--navy-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.scene-card h3{font-size:19px}
.scene-card .en{font-family:var(--f-say);font-size:15px}
.scene-card .who{font-size:13px;color:var(--navy);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{appearance:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-family:var(--f-say);font-size:16px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.bub.p{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--moss-soft);border-bottom-right-radius:4px}
.bub .nm{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:12px;color:var(--muted);margin-bottom:2px}
.say:not(.btn){appearance:none;border:0;background:none;color:var(--navy);cursor:pointer;padding:2px;display:inline-grid;place-items:center}
.say:not(.btn) svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:14px;background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.hint b{color:var(--amber)}
textarea{width:100%;box-sizing:border-box;font:inherit;font-family:var(--f-say);font-size:16px;line-height:1.5;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:96px;resize:vertical}
textarea:focus{border-color:var(--moss)}
.fb{display:flex;flex-direction:column;gap:12px}
.score{display:flex;align-items:center;gap:12px}
.score b{font-family:var(--f-num);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score.hi b{color:var(--moss)} .score.mid b{color:var(--amber)} .score.lo b{color:var(--slip)}
.score span{font-size:14px;min-width:0}
.fb h4{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.fix{display:flex;flex-direction:column;gap:2px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.fix .w{color:var(--slip);text-decoration:line-through;font-family:var(--f-say)}
.fix .r{color:var(--moss);font-weight:600;font-family:var(--f-say)}
.fix .why{color:var(--muted);font-size:13px}
.model{font-family:var(--f-say);font-size:16px;line-height:1.6;background:var(--moss-soft);border-radius:12px;padding:12px}
.phr{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.phr span{min-width:0}
.phr i{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.chip{display:inline-block;font-family:var(--f-num);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.chip.hi{background:var(--moss-soft);color:var(--moss)} .chip.mid{background:var(--amber-soft);color:var(--amber)} .chip.lo{background:var(--slip-soft);color:var(--slip)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--moss);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.ted{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.ted .badge{grid-row:span 3;width:46px;height:46px;border-radius:12px;background:var(--slip);color:var(--onaccent);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:15px;letter-spacing:.02em}
.ted b{font-size:15px;min-width:0}
.ted span{font-size:13px;color:var(--muted);min-width:0}
.sdots{display:flex;gap:6px;flex-wrap:wrap}
.sd{appearance:none;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.sd.ok{background:var(--moss);border-color:var(--moss);color:var(--onaccent)}
.sd.part{border-color:var(--amber);color:var(--amber)}
.sd.cur{outline:2px solid var(--ink);outline-offset:1px}
.line{font-family:var(--f-say);font-size:22px;line-height:1.45;letter-spacing:-.005em}
.line.blur{filter:blur(6px);user-select:none}
.diff{font-family:var(--f-say);font-size:17px;line-height:1.7}
.diff .ok{color:var(--moss)}
.wbtn{appearance:none;border:0;background:none;padding:0;font:inherit;cursor:pointer}
.diff .miss{color:var(--slip);text-decoration:underline wavy;text-underline-offset:3px}
.diff .ex{color:var(--amber);font-size:14px}
.passage{font-family:var(--f-say);font-size:17px;line-height:1.7}
.passage span.ok{background:var(--moss-soft)}
video{width:100%;max-width:100%;border-radius:14px;background:#000}
audio{width:100%}
.checklist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.checklist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.vc{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.vc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vc .h b{font-family:var(--f-say);font-size:18px;min-width:0}
.vc .cn{font-size:13px;color:var(--muted)}
.vc .ex{font-family:var(--f-say);font-size:15px}
.vc.known b{color:var(--moss)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:30}
.sum{display:flex;flex-direction:column;gap:10px}
.sum .it{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
@media (max-width:380px){.modes{grid-template-columns:1fr}.big{font-size:80px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mic{appearance:none;border:0;cursor:pointer;width:72px;height:72px;border-radius:50%;background:var(--slip);color:var(--onaccent);display:grid;place-items:center;flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--slip) 45%,transparent)}
.mic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{animation:pulse 1.2s ease-out infinite;background:var(--slip)}
.mic.on svg{display:none}
.mic.on::after{content:"";width:22px;height:22px;border-radius:5px;background:var(--onaccent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--slip) 45%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.microw{display:flex;align-items:center;gap:14px}
.microw .lab{font-size:14px;color:var(--muted);min-width:0}
.microw .lab b{display:block;color:var(--ink);font-size:15px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cam{position:relative}
.cam video.live{transform:scaleX(-1)}
.cam .rec{position:absolute;top:10px;left:10px;background:var(--slip);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.prompter{font-family:var(--f-say);font-size:19px;line-height:1.6;max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.setup{border-color:var(--navy);background:var(--navy-soft)}
.warnbox{font-size:13px;background:var(--amber-soft);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--slip)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
/* ===================== CONTENT (tokens: {N} name, {C} company, {CITY} city) ===================== */
const RAW=[
{id:'t1',en:'Introductions & Small Talk',cn:'自我介绍与商务寒暄',goal:'30 秒内清楚说出你是谁、做什么、为什么值得聊下去。',
 ted:{who:'Julian Treasure',title:'How to speak so that people want to listen',url:'https://www.ted.com/talks/julian_treasure_how_to_speak_so_that_people_want_to_listen',why:'英国声音专家，讲语调、节奏、音色，第一周打发音底子。'},
 vocab:[
  ['It\'s a pleasure to meet you in person','很高兴终于见到您本人','It\'s a pleasure to meet you in person after all those emails.'],
  ['I look after …','我负责……（英式常用）','I look after compliance and quality at {C}.'],
  ['How was your journey?','路上还顺利吗？','How was your journey? Did you come down from London?'],
  ['a small but growing team','一个小而发展中的团队','We\'re a small but growing team based in {CITY}.'],
  ['I\'ve heard a lot about …','久闻……','I\'ve heard a lot about your new café openings.'],
  ['to touch base','简单碰一下、联系一下','Shall we touch base again next week?'],
  ['What brings you to …?','是什么风把你吹到……？','What brings you to the show this year?'],
  ['Let\'s keep in touch','保持联系','It was great chatting. Let\'s keep in touch.']],
 scenes:[
  {id:'t1a',title:'展会上认识买家',desc:'You are at a food and drink trade show. A buyer for a group of cafés stops at the {C} stand.',cn:'你在食品饮料展会上，一位连锁咖啡店的采购来到你们展位。',partner:{name:'James',role:'Purchasing lead, café group'},
   turns:[
    {p:'Hi there, I don\'t think we\'ve met. I\'m James, I look after purchasing for a group of cafés in the South West.',hint:'自我介绍：名字、公司、你的职位、公司做什么。',model:'Lovely to meet you, James. I\'m {N}, and I look after compliance at {C}. We import ceremonial-grade matcha, hojicha and ube powder, mainly for cafés and food service.'},
    {p:'Compliance! That sounds serious. What does that involve day to day?',hint:'用简单、轻松的话解释你的工作。',model:'It sounds more serious than it is! Day to day, I make sure everything we bring into the UK is safe, properly labelled and fully traceable, so our customers never have to worry about it.'},
    {p:'Interesting. So how long have you been with the company?',hint:'说你刚加入不久，以及你喜欢这份工作的哪一点。',model:'I joined fairly recently, actually, but I\'ve really enjoyed it so far. It\'s a small team, so I get to see the whole journey, from the farm right through to the café counter.'},
    {p:'Well, it\'s been great chatting. Have you got a card?',hint:'递名片，主动提出后续跟进（发资料/样品）。',model:'Of course, here you go. It\'d be great to touch base next week. I could send you our spec sheets and a few samples, if that\'s helpful.'}]},
  {id:'t1b',title:'在办公室接待访客',desc:'A technical auditor from a customer arrives at your {CITY} office for a visit.',cn:'客户的技术审核员来{CITY}办公室拜访，正式开始前先寒暄。',partner:{name:'Sarah',role:'Technical auditor'},
   turns:[
    {p:'Morning! Sorry I\'m a few minutes late. The traffic on the M32 was awful.',hint:'说没关系，聊两句路况，问停车是否顺利。',model:'Morning, Sarah, no problem at all. The M32 is a nightmare at this time of day. Did you manage to find somewhere to park?'},
    {p:'Yes, eventually. Lovely office, by the way. Have you been here long?',hint:'感谢夸奖，简单介绍办公室和周边。',model:'Thank you! It\'s quite compact, but it suits a small team like ours, and there are some lovely cafés nearby for lunch.'},
    {p:'So, before we start, tell me a bit about the team.',hint:'介绍团队规模和分工（采购/产品 vs 合规/质量，物流伙伴）。',model:'Sure. There are only a handful of us. Our Chief Matcha Officer leads sourcing and the product side, and I look after compliance and quality. We also work closely with logistics partners in China and the UK.'},
    {p:'Great. Shall we get started?',hint:'过渡到正式议程：先讲什么，再讲什么，问对方是否同意。',model:'Yes, let\'s. I\'ve printed the agenda for you. I thought we\'d start with a quick overview of our supply chain, then go through the documents you asked for. Does that work for you?'}]}],
 passage:{title:'First impressions',lines:[
  'Good morning, everyone, and thank you for having me.',
  'My name is {N}, and I look after compliance at {C}, a small tea company based in {CITY}.',
  'Now, I know the word compliance doesn\'t exactly get pulses racing.',
  'But behind every cup of matcha you buy, there is a quiet chain of checks, documents and decisions.',
  'My job is to make sure that chain never breaks.',
  'Today, I\'d like to show you how we do that, and why it matters to you.',
  'So, let\'s begin with a simple question: where does your matcha actually come from?']}},

{id:'t2',en:'Meetings: Agreeing & Disagreeing',cn:'开会：表达同意与不同意',goal:'在会上礼貌但坚定地说"不"，并把讨论推向结论。',
 ted:{who:'Margaret Heffernan',title:'Dare to disagree',url:'https://www.ted.com/talks/margaret_heffernan_dare_to_disagree',why:'英式口音的前企业 CEO，讲为什么好团队需要建设性的反对。'},
 vocab:[
  ['Shall we make a start?','我们开始吧？','Right, it\'s ten o\'clock. Shall we make a start?'],
  ['Just to recap, …','简单总结一下……','Just to recap, we\'re holding the batch until Thursday.'],
  ['I take your point, but …','我明白你的意思，但……','I take your point, but the risk is too high.'],
  ['Could I just come in here?','我可以插一句吗？','Sorry, could I just come in here on the timeline?'],
  ['I\'m not sure I agree with that','我不太同意','I\'m not sure I agree with that. The data says otherwise.'],
  ['Let\'s park that for now','这个先放一放','Good question. Let\'s park that for now and come back to it.'],
  ['to be on the same page','达成一致','I just want to make sure we\'re all on the same page.'],
  ['action points','行动项','Let\'s go through the action points before we finish.']],
 scenes:[
  {id:'t2a',title:'周会：检测报告没出能不能先发货',desc:'Weekly operations meeting. Sales want to ship a new matcha batch before the lab results are back.',cn:'运营周会。销售想在检测报告出来之前先把新一批抹茶发出去。',partner:{name:'Mark',role:'Sales manager, chairing'},
   turns:[
    {p:'Right, I think everyone\'s here. {N}, could you kick us off with the compliance update?',hint:'开场：说你有三件事要汇报（检测结果、包装供应商问题、紫薯粉标签），会讲得简短。',model:'Thanks, Mark. I\'ve got three quick updates: the lab results for the new matcha batch, the packaging supplier issue, and the label changes for the ube powder. I\'ll keep it brief.'},
    {p:'Great. On the matcha batch, sales are keen to ship it this week. Can we go ahead?',hint:'礼貌地反对：检测报告还没回来，周四才出，只耽误两天。',model:'I understand the pressure, but I\'d rather we didn\'t ship it until the lab results are back. They\'re due on Thursday, so we\'d only be losing a couple of days.'},
    {p:'A couple of days could cost us the order, though.',hint:'先认可对方，再给折中方案：现在通知客户周五发货，并随货附 CoA。',model:'I take your point. What if we let the customer know now that it\'ll go out on Friday, and offer to send the certificate of analysis with the shipment? That way they can see we\'re being thorough.'},
    {p:'Okay, that could work. Can you summarise where we\'ve landed?',hint:'总结结论和每个人的行动项，并确认大家是否同意。',model:'Sure. Just to recap: we\'ll hold the batch until Thursday\'s results, I\'ll chase the lab tomorrow morning, and you\'ll update the customer today. Is everyone happy with that?'}]},
  {id:'t2b',title:'项目会：新品上市时间太紧',desc:'A project meeting about launching a new liquid concentrate range in March.',cn:'讨论液体浓缩饮品三月上市的项目会，你要提出合规时间线的担忧。',partner:{name:'Priya',role:'Project manager'},
   turns:[
    {p:'So we\'re planning to launch the new liquid range in March. Any concerns from your side?',hint:'提出担忧：上市前需要保质期测试和标签审核，大约八周，三月可以但很紧。',model:'Just one, really. We\'ll need shelf-life testing and a full label review before launch, and that usually takes around eight weeks. March is possible, but it\'s tight.'},
    {p:'Eight weeks? Can\'t we run those in parallel with production?',hint:'解释：标签审核可以并行，保质期测试要用第一批生产的产品，赶不了。',model:'Some of it, yes. The label review can run in parallel, but the shelf-life study needs product from the first production run, so that part can\'t really be rushed.'},
    {p:'Hmm. So what would you suggest?',hint:'建议把首次试产提前两周，并说明理由。',model:'I\'d suggest we bring the first trial run forward by two weeks. That gives us enough data for the shelf-life study and keeps March realistic.'},
    {p:'Let\'s park that for now and come back to it on Friday.',hint:'同意，并说你周五前会准备一个时间线方案对比。',model:'That\'s fine. In the meantime, I\'ll put together a short timeline so we can look at the options side by side on Friday.'}]}],
 passage:{title:'Why good teams disagree',lines:[
  'In the best meetings I\'ve been to, people didn\'t always agree.',
  'In fact, the most useful moments came when someone said, I\'m not sure that\'s right.',
  'Disagreement isn\'t a sign that a team is failing.',
  'It\'s often a sign that people care enough to speak up.',
  'The trick is to challenge the idea, not the person.',
  'So next time you hear an objection, don\'t defend yourself straight away.',
  'Ask a question instead, and you may find a better answer together.']}},

{id:'t3',en:'Product Presentations',cn:'产品演示与问答',goal:'用"结构 + 卖点 + 证据"讲清楚一个产品，并稳住问答环节。',
 ted:{who:'Rory Sutherland',title:'Life lessons from an ad man',url:'https://www.ted.com/talks/rory_sutherland_life_lessons_from_an_ad_man',why:'奥美英国副董事长，典型英式幽默与说服技巧，学怎么"卖感受"。'},
 vocab:[
  ['I\'d like to walk you through …','我带大家过一遍……','I\'d like to walk you through our new range.'],
  ['What sets it apart is …','它的不同之处在于……','What sets it apart is the consistency.'],
  ['shelf life','保质期','It has a shelf life of several months unopened.'],
  ['cost per cup','单杯成本','The cost per cup is lower than you might think.'],
  ['to tailor something to …','为……量身定制','We can tailor the pack size to your stores.'],
  ['That brings me to …','这就引出了……','That brings me to my next point: pricing.'],
  ['off the top of my head','凭印象随口说','I don\'t want to quote a figure off the top of my head.'],
  ['to run a trial','做试点','Could we run a trial in two of your stores?']],
 scenes:[
  {id:'t3a',title:'向连锁咖啡店推介液体抹茶',desc:'You are presenting {C}\'s liquid matcha concentrate to the head of beverages at a café chain.',cn:'你向连锁咖啡店的饮品负责人推介液体抹茶浓缩液。',partner:{name:'Olivia',role:'Head of beverages, café chain'},
   turns:[
    {p:'Thanks for coming in. So, what have you brought to show us today?',hint:'开场：介绍产品 + 你要讲的三部分结构（是什么、吧台怎么用、对利润的意义）。',model:'Thank you for having us. Today I\'d like to walk you through our liquid matcha concentrate. I\'ll cover what it is, how it works behind the bar, and what it could mean for your margins.'},
    {p:'We already use matcha powder. Why would we switch?',hint:'核心卖点：口味稳定、不用打茶、十秒出杯。',model:'What sets it apart is consistency. With powder, every barista whisks it slightly differently. With the concentrate, you just pour and mix, so every latte tastes the same, and it\'s ready in about ten seconds.'},
    {p:'And how long does it keep once it\'s opened?',hint:'回答保质期；具体天数不确定就承诺发规格书书面确认。',model:'Unopened, it keeps for several months. Once opened, it needs to be refrigerated and used within a set number of days. I\'ll send you the exact figures from our spec sheet so you have them in writing.'},
    {p:'What about price? It sounds expensive.',hint:'回应价格异议：单价高，但算上损耗和人工，单杯成本有竞争力，主动提出一起算账。',model:'It\'s a fair question. The unit price is higher than powder, but when you look at the cost per cup, including waste and staff time, it\'s very competitive. I\'d be happy to work through the numbers with you.'}]},
  {id:'t3b',title:'演示后的问答环节',desc:'After your presentation, a retailer\'s quality manager asks some detailed questions.',cn:'演示结束后，零售商的质量经理追问细节，有些你当场答不了。',partner:{name:'David',role:'Quality manager, retailer'},
   turns:[
    {p:'Thanks, that was clear. Can I ask where exactly the tea is grown?',hint:'回答原产地，强调每批都能追溯到农场和加工厂，可提供追溯记录。',model:'Of course. Our matcha powder is grown in China, and every batch can be traced back to the farm and the processing site. I can share the traceability records if you\'d like to see them.'},
    {p:'Is it certified organic?',hint:'核心抹茶粉有有机认证可发证书；其他产品不确定就说核实后回复。',model:'Our core matcha powder is certified organic, and I can send you a copy of the certificate. For the other products, I\'d rather check the details and come back to you than give you the wrong answer.'},
    {p:'What\'s your minimum order quantity?',hint:'不清楚具体数字：说取决于产品和规格，问销售后当天邮件回复。',model:'That depends on the product and the pack size, so I don\'t want to quote a figure off the top of my head. Let me check with our sales team and email you the details by the end of the day.'},
    {p:'Great. Anything else we should know?',hint:'收尾：可以寄样品，建议在两三家门店试点后一起复盘。',model:'Just that we\'re happy to send samples for your team to try. If it works for you, we could run a short trial in two or three of your stores and review the feedback together.'}]}],
 passage:{title:'Ten calm seconds',lines:[
  'Let me tell you about the busiest ten minutes in a café.',
  'It\'s quarter past eight, the queue is out of the door, and someone orders a matcha latte.',
  'The barista sighs, because matcha means sieving, whisking and hoping it doesn\'t clump.',
  'Now imagine that same drink made in the time it takes to say oat milk, please.',
  'That is what we are really selling: not a tea, but ten calm seconds.',
  'People rarely buy a product for what it is.',
  'They buy it for what it changes.']}},

{id:'t4',en:'Compliance & Technical Meetings',cn:'合规与技术会议',goal:'把复杂的合规流程讲得有条理，遇到技术分歧时据理力争但不失礼。',
 ted:{who:'Tim Harford',title:'Trial, error and the God complex',url:'https://www.ted.com/talks/tim_harford_trial_error_and_the_god_complex',why:'英国经济学家，讲试错和系统思维，跟质量管理思路很契合。'},
 vocab:[
  ['traceability','可追溯性','Every pack carries a batch number for full traceability.'],
  ['certificate of analysis (CoA)','检测分析证书','Each batch comes with a certificate of analysis.'],
  ['within the legal limit','在法定限值内','All results were well within the legal limit.'],
  ['a non-conformance','不符合项','We raised a non-conformance against the supplier.'],
  ['corrective action','纠正措施','We agreed corrective actions with the factory.'],
  ['to flag an issue','提出一个问题','I just wanted to flag an issue with the latest report.'],
  ['root cause','根本原因','We\'re still investigating the root cause.'],
  ['a mock recall','模拟召回','We run a mock recall twice a year.']],
 scenes:[
  {id:'t4a',title:'向客户技术团队介绍合规体系',desc:'A retailer\'s technical manager is reviewing {C} as a new supplier.',cn:'零售商技术经理在评估你们做新供应商，你要介绍合规流程。',partner:{name:'Helen',role:'Technical manager, retailer'},
   turns:[
    {p:'Could you talk us through your approval process for a new supplier?',hint:'分四步介绍：问卷 → 审核证书和检测报告 → 风险评估 → 批准并设复审日期。',model:'Certainly. It has four main steps. First, the supplier completes our questionnaire. Then we review their certificates and test reports. Next, we assess the risks, and finally, we approve them with a review date.'},
    {p:'How do you make sure each batch is safe?',hint:'每批有 CoA，我们自己再做重金属、农残、微生物检测；超标就扣留不上市。',model:'Every batch comes with a certificate of analysis, and we carry out our own independent testing for heavy metals, pesticide residues and microbiology. If any result is outside the legal limit, the batch is held and doesn\'t go to market.'},
    {p:'And if something does go wrong, say, a packaging defect?',hint:'不合格处理：立即开不符合项、隔离库存、和供应商查根因、定纠正措施、留记录。',model:'We\'d raise a non-conformance straight away and quarantine the affected stock. Then we\'d investigate the root cause with the supplier, agree corrective actions, and keep a full record.'},
    {p:'Can you trace a product back from a customer\'s shelf?',hint:'可以：通过批号追溯到生产日期、原料和运输批次；定期做模拟召回检验。',model:'Yes. Every pack carries a batch number, and from that we can trace it back to the production date, the raw materials and the shipment. We test the system regularly with mock recalls.'}]},
  {id:'t4b',title:'和供应商 QA 讨论检测结果',desc:'A video call with a supplier\'s QA manager about a lab result that was close to the UK limit.',cn:'和中国供应商的 QA 经理视频，讨论一项接近英国限值的农残结果。',partner:{name:'Kevin',role:'QA manager, tea supplier'},
   turns:[
    {p:'Hello, {N}. You wanted to discuss the latest lab report?',hint:'开门见山：某项农残非常接近英国最大残留限量，想了解原因。',model:'Yes, thanks for making time, Kevin. I wanted to flag an issue. One of the pesticide residues in the latest batch is very close to the UK maximum residue level, so I\'d like to understand what happened.'},
    {p:'Our own test showed it was within the limit.',hint:'礼貌指出差异可能来自检测方法，要求对方提供方法细节和原始数据。',model:'I understand, and I appreciate you sharing that. The difference may be down to the lab methods, but we need to be confident. Could you send us the full method details and the raw data from your lab?'},
    {p:'Sure. What do you need from us going forward?',hint:'改进要求：每批出货前由认可实验室检测，报告至少在离港前一周提供。',model:'Going forward, we\'d like each batch tested by an accredited lab before shipment, and we\'d need the report at least a week before the goods leave the port.'},
    {p:'That should be fine. Anything else?',hint:'总结：今天发邮件书面确认，下一批检测后一起复盘。',model:'No, that\'s everything. I\'ll put this in an email today so we both have a written record, and let\'s review it together once the next batch has been tested.'}]}],
 passage:{title:'Making yes safe',lines:[
  'Most people think compliance is about saying no.',
  'I think it\'s about making yes safe.',
  'Almost every regulation you can name was written after something went wrong.',
  'A label, a test, a signature on a form: each one is a lesson someone learnt the hard way.',
  'When we follow those rules carefully, we\'re not slowing the business down.',
  'We\'re making sure we never have to learn those lessons again.',
  'And that, to me, is what good compliance really looks like.']}},

{id:'t5',en:'Negotiating with Suppliers',cn:'与供应商谈判',goal:'会还价、会交换条件、会把结果落到书面。',
 ted:{who:'Margaret Heffernan',title:'Forget the pecking order at work',url:'https://www.ted.com/talks/margaret_heffernan_forget_the_pecking_order_at_work',why:'讲合作胜过内耗，适合建立长期供应商关系的谈判心态。'},
 vocab:[
  ['lead time','交货周期','The lead time is currently six weeks.'],
  ['minimum order quantity (MOQ)','最小起订量','What\'s the MOQ for the printed bags?'],
  ['We\'d be looking for …','我们期望的是……','We\'d be looking for something closer to fifteen pence.'],
  ['Would you be open to …?','您是否考虑……？','Would you be open to a twelve-month agreement?'],
  ['That\'s a bit higher than we expected','比我们预期的高一些','To be honest, that\'s a bit higher than we expected.'],
  ['to meet halfway','各让一步','If you can do four weeks, we can meet halfway.'],
  ['payment terms','付款条件','Our standard payment terms are thirty days.'],
  ['to put it in writing','书面确认','Could you put that in writing for us?']],
 scenes:[
  {id:'t5a',title:'和包装厂谈价格与交期',desc:'You are negotiating a twelve-month contract for printed tea bags with a packaging supplier.',cn:'你在和包装供应商谈一年期的印刷包装袋合同。',partner:{name:'Linda',role:'Sales manager, packaging company'},
   turns:[
    {p:'So, based on your volumes, our price is eighteen pence per bag.',hint:'表示价格偏高；因为是一年期合作，期望接近 15 便士。',model:'Thanks, Linda. To be honest, that\'s a bit higher than we expected. Given that we\'re looking at a twelve-month commitment, we\'d be looking for something closer to fifteen pence.'},
    {p:'Fifteen is difficult. Film costs have gone up a lot this year.',hint:'表示理解；提出用增加订量 + 固定交货计划换 16 便士。',model:'I understand costs have risen. Would you be open to sixteen pence if we increased the order size and agreed to a fixed delivery schedule?'},
    {p:'We could do sixteen and a half, but the lead time would be six weeks.',hint:'价格可以接受，但六周太长；如果能缩到四周就各让一步成交。',model:'Sixteen and a half could work, but six weeks is too long for us. If you can bring the lead time down to four weeks, I think we can meet halfway.'},
    {p:'Okay, four weeks it is. Shall I send over a revised quote?',hint:'同意，并要求把封口强度检测等质量要求写进报价。',model:'Yes, please. Could you also include the quality requirements we discussed, particularly the seal strength testing, so everything\'s in writing?'}]},
  {id:'t5b',title:'拒绝预付款，谈付款条件',desc:'A new freight forwarder wants full payment upfront before releasing a shipment.',cn:'新的货代要求放货前全额预付，你要争取付款条件。',partner:{name:'Ben',role:'Account manager, freight forwarder'},
   turns:[
    {p:'We\'d need full payment upfront before we release the shipment.',hint:'礼貌拒绝：我们标准条件是发票后 30 天，其他物流伙伴也是如此。',model:'I\'m afraid that won\'t work for us. Our standard terms are thirty days from invoice, and that\'s what we have with our other logistics partners.'},
    {p:'We usually only offer thirty days to larger clients.',hint:'强调虽然现在规模小，但增长快，寻求长期合作。',model:'I appreciate that. We may be small at the moment, but our volumes are growing quickly, and we\'re looking for a partner we can work with for the long term.'},
    {p:'What if we did fifty per cent upfront and the rest on delivery?',hint:'折中：前三个月可以这样，之后建立信用再转 30 天账期。',model:'That\'s a reasonable starting point. How about we do that for the first three months, and then move to thirty days once we\'ve built up a track record?'},
    {p:'I\'d need to check with my manager.',hint:'可以，请对方周五前答复，因为下周初要订下一票货。',model:'Of course. Could you let me know by Friday? We\'d like to book the next shipment early next week.'}]}],
 passage:{title:'The deal that lasts',lines:[
  'The best negotiators I\'ve met rarely talk the most.',
  'They ask good questions, and then they listen.',
  'Because the price on the table is almost never the whole story.',
  'Behind it there\'s a worry about cash flow, a target to hit, or a boss to please.',
  'Once you understand that, you can offer something that costs you little but means a lot to them.',
  'That\'s how both sides walk away feeling they\'ve won.',
  'And that\'s the kind of deal that lasts.']}},

{id:'t6',en:'Handling Problems & Complaints',cn:'处理问题与客户投诉',goal:'先共情、再解决、再预防，把坏消息讲得让人放心。',
 ted:{who:'Tim Harford',title:'How frustration can make us more creative',url:'https://www.ted.com/talks/tim_harford_how_frustration_can_make_us_more_creative',why:'讲混乱和挫折如何带来更好的解决方案，适合"出问题"这周的心态。'},
 vocab:[
  ['I\'m so sorry to hear that','非常抱歉听到这个情况','I\'m so sorry to hear that. Let me sort it out.'],
  ['Let me look into it','我来查一下','Let me look into it and call you back this afternoon.'],
  ['to get to the bottom of','查清楚','We\'re determined to get to the bottom of it.'],
  ['at no cost to you','不收您任何费用','We\'ll send replacements at no cost to you.'],
  ['to keep someone posted','随时告知进展','I\'ll keep you posted on what we find.'],
  ['to be held at the port','在港口被扣','The container has been held at the port.'],
  ['a goodwill gesture','表示诚意的补偿','As a goodwill gesture, we\'ve added a free sample pack.'],
  ['to split a delivery','分批发货','We can split the delivery from existing stock.']],
 scenes:[
  {id:'t6a',title:'客户投诉包装袋破裂',desc:'A café owner calls because many bags in the last delivery split at the seal. It\'s the second time.',cn:'咖啡店老板来电，上一批货很多袋子封口处裂开，而且是第二次了。',partner:{name:'Emma',role:'Café owner'},
   turns:[
    {p:'Hi, I\'m calling because half the bags in our last delivery were split at the seal.',hint:'先道歉，再收集信息：批号、受影响数量、请对方发照片。',model:'I\'m so sorry to hear that, Emma. Could you tell me the batch number on the bags, and roughly how many are affected? Photos would really help us too.'},

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function weekIndex(){const d=Math.floor((todayD()-parseD(S.start))/864e5);return {w:Math.max(0,Math.floor(d/7))%8,day:((d%7)+7)%7,round:Math.floor(Math.max(0,d)/56)+1}}
function dayRec(k){return S.days[k]||(S.days[k]={sec:0,ok:0})}
function streak(){const t=todayD();let d=S.days[ds(t)]&&S.days[ds(t)].ok?t:addDays(t,-1);let c=0;while(S.days[ds(d)]&&S.days[ds(d)].ok){c++;d=addDays(d,-1)}return c}
function stats(){let best=0,run=0,prev=null,total=0,sec=0;Object.keys(S.days).sort().forEach(k=>{const v=S.days[k];sec+=v.sec||0;if(v.ok){total++;run=(prev&&ds(addDays(parseD(prev),1))===k&&S.days[prev].ok)?run+1:1;best=Math.max(best,run)}else run=0;prev=k});return {best:Math.max(best,streak()),total,hours:sec/3600}}
function themeProg(t){const v=t.vocab.filter((_,i)=>S.vocab[t.id+'-'+i]).length;

let WK=null,wReady=false,wJobs={},wSeq=0;
function whisperWorker(){

env.allowLocalModels=false;

self.onmessage=async e=>{const d=e.data;try{const m=await load(d.model);if(d.type==='load'){self.postMessage({type:'ready'});return}
  const out=await m(d.audio,{chunk_length_s:30,stride_length_s:5});self.postMessage({type:'result',id:d.id,text:(out&&out.text||'').trim()})}
  catch(err){self.postMessage({type:'error',id:d.id,message:String(err&&err.message||err)})}};`;
  WK=new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})),{type:'module'});

  mr.onstop=async()=>{clearInterval(s.timer);st.getTracks().forEach(t=>t.stop());L=null;setMicUI();
    if(s.discard||!ch.length)return;

    document.querySelectorAll('.myaudio').forEach(a=>{a.src=myAudioURL;a.hidden=false});

    try{const {audio,secs}=await to16k(blob);if(secs<0.6){diag('录得太短了，再说一次。',true);return}
      const text=(await transcribe(audio)).replace(/\[.*?\]|\(.*?\)/g,' ').replace(/\s+/g,' ').trim();
      if(!text){diag('没听清，靠近手机再说一次。',true);return}

function listen(ta,onDone){
  if(L){stopListen();return}
  if(useWhisper())return listenWhisper(ta,onDone);
  try{speechSynthesis.cancel()}catch(e){}
  if(myAudioURL){URL.revokeObjectURL(myAudioURL);myAudioURL=null}
  const s={final:'',tFirst:0,tLast:0,confs:[],err:null,onDone,ta,stopped:false,got:false,rounds:0,t0:Date.now()};L=s;
  if(ta)ta.value='';
  const run=()=>{
    const r=new SR();r.lang=srLang;r.interimResults=true;r.maxAlternatives=1;
    r.continuous=!IS_MOBILE; // Android Chrome is only reliable one utterance at a time; we restart it ourselves
    s.r=r;s.got=false;s.rounds++;
    r.onstart=()=>diag('已启动，等待麦克风…');
    r.onaudiostart=()=>diag('麦克风已打开，请开始说');
    r.onspeechstart=()=>diag('听到你在说话…');
    r.onresult=e=>{s.got=true;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];const now=performance.now();if(!s.tFirst)s.tFirst=now;s.tLast=now;
        if(res.isFinal){s.final+=(s.final?' ':'')+res[0].transcript.trim();if(res[0].confidence>0)s.confs.push(res[0].confidence)}else interim+=res[0].transcript}
      const txt=(s.final+' '+interim).trim();if(s.ta)s.ta.value=txt;diag('识别中：'+txt.slice(-60))};
    r.onerror=e=>{s.err=e.error;if(e.error==='no-speech'&&s.final)return;
      if(e.error==='language-not-supported'&&srLang!=='en-US'){srLang='en-US'}
      diag(SR_ERR[e.error]||('识别出错：'+e.error),true)};
    r.onend=()=>{if(L!==s)return;
      const fatal=s.err&&s.err!=='no-speech';
      // keep listening across pauses on mobile until she taps stop (max 2 min)
      if(!s.stopped&&!fatal&&IS_MOBILE&&s.got&&Date.now()-s.t0<120000){s.err=null;try{run();return}catch(e){}}
      finish()};
    r.start();
  };
  const finish=()=>{L=null;stopRecorder();setMicUI();
    const text=(s.ta?s.ta.value:s.final).trim();const span=s.tFirst&&s.tLast?(s.tLast-s.tFirst)/1000:0;const secs=span>1.5?span+0.6:0;
    const conf=s.confs.length?s.confs.reduce((a,b)=>a+b,0)/s.confs.length:0;
    if(text){diag('识别完成');if(s.onDone)s.onDone({text,secs,conf})}
    else if(!s.err||s.err==='no-speech'||s.err==='service-not-allowed'||s.err==='network'){
      if(P.engine==='auto'){P.srBroken=true;saveP();diag('这台手机的浏览器识别没有返回结果，已自动切换到"本机识别"。请再点一次红色按钮说。',true)}
      else if(!s.err)diag('这次没有识别到文字。可以在设置里把识别方式改成"本机识别"。',true)}};
  try{run()}catch(e){L=null;diag('语音识别启动失败：'+e.message,true);return}
  if(P.recVoice)startRecorder();
  setMicUI();
}

async function blobB64(b){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(b)})}
function parseJSON(t){try{return JSON.parse(t)}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}return null}
async function ai(prompt,opt){opt=opt||{};if(!P.key)return null;
  const content=[];for(const b of (opt.images||[]))content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobB64(b)}});
  content.push({type:'text',text:prompt+'\n\nReply with only the JSON, no other text.'});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':P.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:P.model||'claude-sonnet-5-5',max_tokens:opt.max||1600,messages:[{role:'user',content}]})});
  if(!res.ok){let msg='';try{const j=await res.json();msg=j.error&&j.error.message||''}catch(e){}
    const err=new Error(res.status===401?'API Key 无效，请到设置里检查':res.status===429?'调用太频繁或额度不足，稍后再试':res.status===400&&/credit/i.test(msg)?'API 账户余额不足，请到 console.anthropic.com 充值':('AI 请求失败（'+res.status+'）'+msg.slice(0,120)));throw err}
  const j=await res.json();const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');const v=parseJSON(txt);if(v==null)throw new Error('AI 返回格式有误，再试一次');return v}

const NUM='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const nw=n=>{n=+n;if(n<20)return NUM[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+NUM[n%10]:'');return String(n)};
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/(\d+)\s*%/g,'$1 per cent').replace(/\bpercent\b/g,'per cent')
  .replace(/(\d+):(\d{2})/g,'$1 $2').replace(/\d+/g,d=>+d<100?nw(d):d).replace(/-/g,' ').replace(/'/g,'').replace(/[^a-z0-9 ]+/g,' ')
  .split(/\s+/).filter(Boolean)}
function align(t,h){const n=t.length,m=h.length;const dp=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=t[i]===h[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false),extra=[];let i=0,j=0;
  while(i<n&&j<m){if(t[i]===h[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else{extra.push(h[j]);j++}}
  while(j<m)extra.push(h[j++]);const match=dp[0][0];
  const score=(match===n&&m===n)?100:Math.min(99,Math.round(100*2*match/Math.max(1,n+m)));return {ok,extra,score,t,miss:t.filter((w,k)=>!ok[k])}}
function diffHTML(r){return '<div class="diff">'+r.t.map((w,i)=>r.ok[i]?`<span class="ok">${esc(w)}</span>`:`<button class="say wbtn miss" data-say="${esc(w)}" data-rate="0.6" type="button">${esc(w)}</button>`).join(' ')+
  (r.extra.length?`<div class="ex">多出 / 识别成：${esc(r.extra.join(' '))}</div>`:'')+'</div>'}

let R=null;
function startScene(arg){R={theme:arg.theme,scene:arg.scene,i:0,done:[],blind:false,fb:null,busy:false,draft:'',meta:null};renderScene();autoSpeak()}
function allScenes(th){return th.scenes.concat(S.gen[th.id]||[])}
function renderScene(){
  const th=R.theme,sc=R.scene,turn=sc.turns[R.i];
  let chat='';R.done.forEach((d,k)=>{const tu=sc.turns[k];chat+=`<div class="bub p"><div class="nm">${esc(sc.partner.name)}<button class="say" data-say="${esc(tu.p)}" data-alt="1" type="button" aria-label="播放">${IC.play}</button></div>${esc(tu.p)}</div><div class="bub me"><div class="nm">你 <span class="chip ${cls(d.score)}">${d.score}</span></div>${esc(d.ans)}</div>`});
  let body='';
  if(turn){
    chat+=`<div class="bub p"><div class="nm">${esc(sc.partner.name)} · ${esc(sc.partner.role)}<button class="say" data-say="${esc(turn.p)}" data-alt="1" type="button" aria-label="播放">${IC.play}</button><button class="say" data-say="${esc(turn.p)}" data-alt="1" data-rate="0.7" type="button" aria-label="慢速播放">${IC.slow}</button></div>${esc(turn.p)}</div>`;
    body=`${R.blind?'':`<div class="hint"><b>你要表达：</b>${esc(turn.hint)}</div>`}
      ${R.fb?fbHTML(R.fb,turn):`<div class="card">${micRow('点红色按钮，开口回答')}
      <label class="note" for="ans">识别结果（第 ${R.i+1}/${sc.turns.length} 句，可手动修改明显的识别错误，但发音问题别改）</label>
      <textarea id="ans" placeholder="你说的话会出现在这里…" autocapitalize="sentences">${esc(R.draft)}</textarea>
      ${metaHTML(R.meta)}${audioHTML()}
      <div class="row"><button class="btn solid" id="evalBtn" type="button" ${R.busy?'disabled':''}>提交评估</button><button class="btn" id="peekBtn" type="button">我不会，先看范例</button></div>
      <div id="evalOut"></div></div>`}`;
  }else{
    const avg=Math.round(R.done.reduce((a,d)=>a+d.score,0)/Math.max(1,R.done.length));
    body=`<div class="card sum"><div class="score ${cls(avg)}"><b>${avg}</b><span>本场平均分。${avg>=85?'这个场景你已经能熟练应对了。':'再练一遍，重点看下面分数低的句子。'}</span></div>
      ${sc.turns.map((tu,k)=>`<div class="it"><div class="row"><span class="chip ${cls(R.done[k]?R.done[k].score:0)}">${R.done[k]?R.done[k].score:'-'}</span><span class="note">范例</span><button class="say" data-say="${esc(tu.model)}" type="button" aria-label="播放">${IC.play}</button></div><div class="model">${esc(tu.model)}</div></div>`).join('')}
      <div class="row"><button class="btn solid" id="againBtn" type="button">再练一遍</button><button class="btn" id="blindBtn" type="button">盲练（隐藏中文提示）</button><button class="btn" id="homeBtn" type="button">回首页</button></div></div>`;
  }
  const gens=S.gen[th.id]||[];
  app.innerHTML=`${topBar('模式一 · '+th.cn)}
   <div class="tabs">${th.scenes.map((s,i)=>`<button class="tab ${sc.id===s.id?'on':''}" data-s="${s.id}" type="button">场景 ${'AB'[i]}</button>`).join('')}${gens.map((s,i)=>`<button class="tab ${sc.id===s.id?'on':''}" data-s="${s.id}" type="button">AI ${i+1}</button>`).join('')}<button class="tab" id="genBtn" type="button">＋ AI 新场景</button></div>
   <div class="scene-card"><span class="who">场景 · ${esc(sc.partner.name)}（${esc(sc.partner.role)}）</span><h3>${esc(sc.title)}</h3><p class="en">${esc(sc.desc)}</p><p class="note">${esc(sc.cn)}</p>
     <div class="row"><button class="btn ${R.blind?'ghost-navy':''}" id="blindTg" type="button">${R.blind?'盲练中 · 显示提示':'盲练模式'}</button></div></div>
   <div class="chat">${chat}</div>${body}`;
  bindBack();bindSays();
  const $=id=>document.getElementById(id);
  app.querySelectorAll('.tab[data-s]').forEach(b=>b.onclick=()=>{const s=allScenes(th).find(x=>x.id===b.dataset.s);if(s){stopListen();R={theme:th,scene:s,i:0,done:[],blind:R.blind,fb:null,busy:false,draft:'',meta:null};renderScene();autoSpeak()}});
  $('genBtn').onclick=genScene;
  $('blindTg').onclick=()=>{keepDraft();R.blind=!R.blind;renderScene()};
  const ta=$('ans');if(ta)ta.oninput=()=>{R.draft=ta.value};
  const mb=$('micBtn');if(mb)mb.onclick=()=>listen(ta,m=>{R.draft=m.text;R.meta=m;const mm=document.querySelector('#ans + .meta');if(mm)mm.remove();ta.insertAdjacentHTML('afterend',metaHTML(m))});
  const eb=$('evalBtn');if(eb)eb.onclick=()=>doEval();
  const pk=$('peekBtn');if(pk)pk.onclick=()=>{stopListen();R.fb={peek:true,score:0};renderScene()};
  const nx=$('nextBtn');if(nx)nx.onclick=()=>{R.done.push({ans:R.fb.ans||'（看了范例）',score:R.fb.score||0});R.i++;R.fb=null;R.draft='';R.meta=null;renderScene();autoSpeak()};
  const rt=$('retryBtn');if(rt)rt.onclick=()=>{R.fb=null;R.draft='';R.meta=null;renderScene()};
  const ag=$('againBtn');if(ag)ag.onclick=()=>{R.i=0;R.done=[];R.fb=null;renderScene();autoSpeak()};
  const bl=$('blindBtn');if(bl)bl.onclick=()=>{R.i=0;R.done=[];R.fb=null;R.blind=true;renderScene();autoSpeak()};
  const hb=$('homeBtn');if(hb)hb.onclick=()=>go('home');
  app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const [en,cn]=JSON.parse(b.dataset.save);if(!S.saved.some(x=>x.en===en)){S.saved.unshift({en,cn,from:th.id});save()}b.textContent='已加入';b.disabled=true});
}
function keepDraft(){const ta=document.getElementById('ans');if(ta)R.draft=ta.value}
function autoSpeak(){const tu=R.scene.turns[R.i];if(tu)setTimeout(()=>speak(tu.p,{alt:true}),250)}
function fbHTML(fb,turn){
  const listenModel=`<div class="row" style="margin-top:6px"><button class="say btn" data-say="${esc(fb.model||turn.model)}" type="button">${IC.play}听范例</button><button class="say btn" data-say="${esc(fb.model||turn.model)}" data-rate="0.75" type="button">${IC.slow}慢速</button></div>`;
  if(fb.peek)return `<div class="card fb"><h4>参考回答</h4><div class="model">${esc(turn.model)}</div>${listenModel}<p class="note">先跟着范例读几遍，再点"再说一次"用自己的话说出来。</p><div class="row"><button class="btn solid" id="retryBtn" type="button">再说一次</button><button class="btn" id="nextBtn" type="button">跳过，下一句</button></div></div>`;
  const g=(fb.grammar||[]).map(x=>`<div class="fix"><span class="w">${esc(x.wrong)}</span><span class="r">${esc(x.right)}</span>${x.why?`<span class="why">${esc(x.why)}</span>`:''}</div>`).join('');
  const pr=(fb.pron||[]).map(x=>`<div class="fix"><span><span class="w">${esc(x.heard)}</span> → <span class="r">${esc(x.meant)}</span></span><span class="why">${esc(x.tip)}</span><span class="row"><button class="say btn" data-say="${esc(x.meant)}" data-rate="0.6" type="button">${IC.slow}听正确读音</button></span></div>`).join('');
  const ph=(fb.phrases||[]).map(x=>`<div class="phr"><span>${esc(x.en)}<i>${esc(x.cn)}</i></span><button class="btn" data-save='${esc(JSON.stringify([x.en,x.cn]))}' type="button">加入生词本</button></div>`).join('');
  return `<div class="card fb">
   <div class="score ${cls(fb.score)}"><b>${fb.score}</b><span>${esc(fb.verdict||'')}</span></div>
   <div><h4>你说的</h4><p style="font-family:var(--f-say)">${esc(fb.ans)}</p>${metaHTML(fb.meta)}${audioHTML()}</div>
   ${g?`<div class="fb"><h4>语法纠正</h4>${g}</div>`:''}
   ${fb.structure?`<div><h4>句子结构与表达</h4><p style="font-size:14px">${esc(fb.structure)}</p></div>`:''}
   ${pr?`<div class="fb"><h4>发音提示</h4>${pr}</div>`:''}
   ${fb.better?`<div><h4>在你原句基础上改好的版本</h4><div class="model">${esc(fb.better)}</div><div class="row" style="margin-top:6px"><button class="say btn" data-say="${esc(fb.better)}" type="button">${IC.play}听</button></div></div>`:''}
   <div><h4>完整范例回答</h4><div class="model">${esc(fb.model||turn.model)}</div>${listenModel}</div>
   ${ph?`<div><h4>值得记下的表达</h4>${ph}</div>`:''}
   ${fb.local?`<p class="note">${esc(fb.local)}</p>`:''}
   <div class="row"><button class="btn solid" id="nextBtn" type="button">${R.i+1<R.scene.turns.length?'下一句':'完成本场'}</button><button class="btn" id="retryBtn" type="button">再说一次</button></div></div>`}

async function doEval(){
  stopListen();
  const ta=document.getElementById('ans');const ans=(ta.value||'').trim();if(ans.length<3){toast('先说一句再提交');return}
  R.draft=ans;R.busy=true;const out=document.getElementById('evalOut');document.getElementById('evalBtn').disabled=true;
  const th=R.theme,sc=R.scene,turn=sc.turns[R.i];let fb=null,localMsg='';
  if(P.key){
    out.innerHTML='<div class="loading"><span class="spin"></span>AI 正在听你的回答…</div>';
    const history=sc.turns.slice(0,R.i).map((tu,k)=>`${sc.partner.name}: ${tu.p}\n${P.name||'Learner'}: ${R.done[k]?R.done[k].ans:''}`).join('\n');
    const m=R.meta;const metaLine=m&&m.text===ans?`Speech data: ${wpm(ans,m.secs)||'unknown'} words per minute${m.conf?`, recogniser confidence ${Math.round(m.conf*100)}%`:''}.`:'(The text may have been edited or typed.)';
    const prompt=`You are a warm but exacting British English business-communication coach. Your student, ${P.name||'the learner'}, is a native Mandarin speaker working at ${P.company||'a company'}, ${bio()}. She is practising spoken business English, theme: "${th.en}".
Scenario: ${sc.desc}
She is talking to ${sc.partner.name} (${sc.partner.role}).
${history?'Conversation so far:\n'+history+'\n':''}${sc.partner.name} has just said: "${turn.p}"
What she was asked to convey (Chinese brief): ${turn.hint}
A reference answer: "${turn.model}"

Her spoken answer, transcribed by a British English (en-GB) speech recogniser:
"""${ans}"""
${metaLine}

Evaluate it. Words that look wrong or out of place in context were probably mis-recognised because of her pronunciation; use them to infer specific pronunciation problems (e.g. "sheet" for "seat" = vowel length; dropped word endings; stress). Comment on pace if it is clearly too fast or slow.
Judge: content (did she convey the brief), grammar, sentence structure and naturalness for a British workplace, register/politeness, and use of useful business phrases. Score 0-100 (85+ = would sound natural and professional to a British colleague).
Write all explanations in concise Simplified Chinese; keep English examples in British spelling.
JSON shape:
{"score":78,"verdict":"一句中文总评","grammar":[{"wrong":"exact wrong fragment","right":"corrected fragment","why":"中文原因"}],"structure":"中文：句子结构/逻辑/语气上怎么改更地道","pron":[{"heard":"recognised word","meant":"intended word","tip":"中文发音要点，可含英式音标"}],"better":"her own answer minimally corrected so it sounds natural","model":"a complete, comprehensive model answer (2-4 sentences) that conveys the brief in natural British business English","phrases":[{"en":"useful phrase","cn":"中文"}]}
At most 4 grammar items, 3 pron items, 3 phrases.`;
    try{const r=await ai(prompt);if(r&&typeof r.score==='number')fb=r}catch(e){localMsg=e.message+'。这次先按和范例的重合度打分。'}
  }else localMsg='没开 AI 点评，这次按和范例的关键词重合度打分。在设置里填 API Key 可获得完整的语法和发音点评。';
  if(!fb){const a=align(norm(turn.model),norm(ans));fb={score:Math.max(20,Math.min(80,a.score+20)),verdict:'和范例的关键词重合度',model:turn.model}}
  fb.local=localMsg;fb.score=Math.max(0,Math.min(100,Math.round(fb.score)));fb.ans=ans;fb.meta=R.meta;
  const key=sc.id+'-'+R.i;if(!sc.id.startsWith('g'))S.turns[key]=Math.max(S.turns[key]||0,fb.score);
  save();R.fb=fb;R.busy=false;renderScene();
}
async function genScene(){
  const th=R.theme;if(!P.key){toast('生成新场景需要在设置里开启 AI 点评');return}
  const b=document.getElementById('genBtn');b.disabled=true;b.textContent='生成中…';

async function explainMiss(line,miss,heard){const out=document.getElementById('whyOut');out.innerHTML='<div class="loading"><span class="spin"></span>正在分析…</div>';
  try{const r=await ai(`A Mandarin-speaking learner shadowed this British English sentence: "${line}"\nAn en-GB speech recogniser heard: "${heard}"\nThese target words were not recognised: ${miss.join(', ')}.\nFor each missed word (max 5), explain in concise Simplified Chinese the most likely pronunciation problem for a Chinese speaker and how to fix it, with British IPA. Also note any linking/connected speech in the sentence she should copy.\nJSON shape: {"words":[{"word":"...","ipa":"/.../","tip":"中文"}],"linking":"中文：连读/弱读要点"}`,{max:900});
    out.innerHTML=`<div class="fb">${(r.words||[]).map(w=>`<div class="fix"><span class="r">${esc(w.word)} <span style="font-weight:400">${esc(w.ipa)}</span></span><span class="why">${esc(w.tip)}</span><span class="row"><button class="say btn" data-say="${esc(w.word)}" data-rate="0.6" type="button">${IC.slow}慢速</button></span></div>`).join('')}${r.linking?`<p class="note">${esc(r.linking)}</p>`:''}</div>`;bindSays()}
  catch(e){out.innerHTML=`<p class="note">${esc(e.message)}</p>`}}
function importHTML(val){return `<div class="card"><b>导入 TED 文字稿片段</b><p class="note">在 TED 页面打开 Read transcript，复制你想练的一段（建议 5–10 句，讲者语速平稳的部分），粘贴到下面。会自动拆成单句，只保存在这台设备上。</p><textarea id="impTa" style="min-height:140px" placeholder="粘贴英文文字稿…">${esc(val||'')}</textarea><div class="row"><button class="btn solid" id="impSave" type="button">拆句并保存</button>${(S.custom[H.theme.id]||[]).length?'<button class="btn" id="impCancel" type="button">取消</button>':''}</div></div>`}
function bindImport(){const b=document.getElementById('impSave');if(!b)return;
  const c=document.getElementById('impCancel');if(c)c.onclick=()=>{H.importing=false;renderShadow()};
  b.onclick=()=>{const raw=document.getElementById('impTa').value.replace(/\((?:Laughter|Applause)\)/gi,' ').replace(/\s+/g,' ').trim();
  const parts=(raw.match(/[^.!?]+[.!?]+["”’]?|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=2).slice(0,30);
  if(!parts.length){toast('没识别到句子，检查一下粘贴的内容');return}
  const th=H.theme;(S.custom[th.id]||[]).forEach((_,i)=>delete S.sents['c-'+th.id+'-'+i]);S.custom[th.id]=parts;save();H.src='c';H.i=0;H.stage=1;H.res=null;H.importing=false;toast('已拆成 '+parts.length+' 句');renderShadow()}}
function playSeq(lines,rate){let i=0;const nxt=()=>{if(i>=lines.length||view!=='shadow')return;const l=lines[i++];speak(l,{rate,onend:()=>setTimeout(nxt,350)})};nxt()}

/* ----- camera ----- */
let CAM=null; // {stream, rec, chunks, frames, timer}
function closeCam(){if(!CAM)return;try{clearInterval(CAM.timer);if(CAM.rec&&CAM.rec.state!=='inactive')CAM.rec.stop()}catch(e){}CAM.stream.getTracks().forEach(t=>t.stop());CAM=null}
function grabLive(v){const w=v.videoWidth,h=v.videoHeight;if(!w)return null;const sc=Math.min(1,900/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c}
function bindCam(lines){const $=id=>document.getElementById(id);
  const on=$('camOn'),rb=$('recBtn'),live=$('live');
  if(on)on.onclick=async()=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('这个浏览器打不开摄像头，可以用"上传视频"');return}
    try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:true});closeCam();CAM={stream:st,frames:[]};live.srcObject=st;live.hidden=false;on.hidden=true;rb.hidden=false}
    catch(e){toast('没有摄像头权限：在浏览器地址栏的权限里允许摄像头和麦克风')}};
  if(rb)rb.onclick=()=>{if(!CAM)return;
    if(CAM.rec&&CAM.rec.state==='recording'){clearInterval(CAM.timer);CAM.rec.stop();return}
    let mr;try{mr=new MediaRecorder(CAM.stream)}catch(e){toast('这个浏览器不支持录像，可以用"上传视频"');return}
    const ch=[];CAM.rec=mr;CAM.frames=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    mr.onstop=()=>{const blob=new Blob(ch,{type:mr.mimeType||'video/webm'});const frames=CAM.frames;closeCam();H.videoFile=blob;H.frames=frames;H.videoURL=URL.createObjectURL(blob);H.vfb=null;renderShadow()};
    mr.start(1000);rb.textContent='停止录制';$('recTag').hidden=false;
    CAM.timer=setInterval(()=>{const c=grabLive(live);if(c)c.toBlob(b=>{if(b&&CAM){CAM.frames.push(b);if(CAM.frames.length>24)CAM.frames.splice(1,1)}},'image/jpeg',0.82)},2500)};
  const up=$('vidUp');if(up)up.onchange=()=>{const f=up.files[0];if(f){H.videoFile=f;H.frames=[];H.videoURL=URL.createObjectURL(f);H.vfb=null;renderShadow()}};
  const rr=$('reRec');if(rr)rr.onclick=()=>{if(H.videoURL)URL.revokeObjectURL(H.videoURL);H.videoURL=null;H.videoFile=null;H.frames=[];H.vfb=null;renderShadow()};
  const sv=$('saveVid');if(sv)sv.onclick=()=>{const ext=/mp4/.test(H.videoFile.type)?'mp4':'webm';const a=document.createElement('a');a.href=H.videoURL;a.download='speakup-'+ds(todayD())+'.'+ext;document.body.appendChild(a);a.click();a.remove()};
  const ve=$('vEval');if(ve)ve.onclick=()=>videoEval(lines);
}
async function framesFromFile(file,n){const url=URL.createObjectURL(file);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  await new Promise(r=>{v.onloadeddata=r;v.onerror=r;setTimeout(r,6000)});let d=v.duration;if(!isFinite(d)||!d)d=8;const out=[];
  for(let k=0;k<n;k++){await new Promise(r=>{v.onseeked=r;v.currentTime=Math.min(d-0.1,d*(k+0.5)/n);setTimeout(r,2500)});const c=grabLive(v);if(c){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(b)out.push(b)}}
  URL.revokeObjectURL(url);return out}
function pickN(arr,n){if(arr.length<=n)return arr;const out=[];for(let k=0;k<n;k++)out.push(arr[Math.floor((k+0.5)*arr.length/n)]);return out}
function vfbHTML(v){return `<div class="fb card" style="background:var(--bg)"><h4>AI 点评</h4><p style="font-size:14px">${esc(v.overall)}</p>${(v.items||[]).map(x=>`<div class="fix"><span class="r" style="font-family:var(--f-body)">${esc(x.area)} · ${esc(x.rating)}</span><span class="why">${esc(x.note)}</span></div>`).join('')}${(v.tips||[]).length?`<h4>下次录之前</h4><ul style="margin:0;padding-left:18px;font-size:14px">${v.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`}
async function videoEval(lines){const out=document.getElementById('vOut');out.innerHTML='<div class="loading"><span class="spin"></span>正在截取画面并点评…</div>';
  try{let frames=pickN(H.frames||[],5);if(frames.length<2)frames=await framesFromFile(H.videoFile,5);if(!frames.length)throw new Error('没能读取视频画面，换成 MP4 再试，或用下面的自查清单。');
    const v=await ai(`These ${frames.length} images are frames, in time order, from a video of ${P.name||'a learner'} (a Mandarin-speaking professional in the UK) rehearsing this short business talk to camera:\n"${lines.join(' ')}"\nCoach her delivery like a British presentation coach: eye contact with the lens, facial expression and whether it fits the words, posture, gestures; framing or lighting only if it hurts the delivery. Be specific to what you see; kind but honest. Concise Simplified Chinese.\nJSON shape: {"overall":"一两句总评","items":[{"area":"眼神|表情|体态|手势|画面","rating":"好/一般/需改进","note":"具体观察和建议"}],"tips":["下次录之前做的 1-3 件事"]}`,{images:frames,max:1200});
    H.vfb=v;out.innerHTML=vfbHTML(v)}
  catch(e){out.innerHTML=`<p class="note">${esc(e.message)}</p>`}}

     <span class="row">${(SR||window.MediaRecorder)?`<button class="btn vmic" data-i="${i}" type="button">${IC.mic}跟读例句</button>`:''}<button class="btn ${on?'solid':''}" data-k="${k}" type="button">${on?'✓ 已掌握':'标记为已掌握'}</button><span class="vres" id="vr${i}"></span></span></div>`}).join('')}
   </div>
   <div class="card"><h3 style="font-size:17px">生词本 (${S.saved.length})</h3>${S.saved.length?S.saved.map((x,i)=>`<div class="phr"><span>${esc(x.en)}<i>${esc(x.cn)}</i></span><span class="row"><button class="say" data-say="${esc(x.en)}" type="button" aria-label="播放">${IC.play}</button><button class="btn" data-del="${i}" type="button">移除</button></span></div>`).join(''):'<p class="note">在模式一的 AI 点评里点"加入生词本"，好的表达会收集到这里。</p>'}</div>`;
  bindBack();bindSays();
  app.querySelectorAll('.vmic').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const out=document.getElementById('vr'+i);if(L){stopListen();return}
    out.innerHTML='<span class="chip mid">在听…</span>';listen(null,m=>{const r=align(norm(th.vocab[i][2]),norm(m.text));out.innerHTML=`<span class="chip ${cls(r.score)}">${r.score}%</span>${r.miss.length?` <span class="note">没读准：${esc(r.miss.join(' '))}</span>`:''}`})});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.vocab[k])delete S.vocab[k];else S.vocab[k]=1;save();renderVocab()});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.saved.splice(+b.dataset.del,1);save();renderVocab()});
}

renderHome();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
